<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>BrowserX</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --muted: #888;
      --line: #e6e6e6;
      --field: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b1b; --fg: #eee; --muted: #8a8a8a; --line: #2e2e2e; --field: #252525; }
    }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--bg); }
    body {
      width: 280px;
      color: var(--fg);
      font: 13px/1.4 system-ui, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.page { margin: 48px auto; border: 1px solid var(--line); border-radius: 8px; }

    .row { display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 40px; }
    .row + .row { border-top: 1px solid var(--line); }

    .head { min-height: 44px; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 600; }
    .state { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
    .on .state { color: var(--fg); }
    .on .dot { background: currentColor; }

    label { width: 40px; color: var(--muted); flex: none; }
    input {
      flex: 1; min-width: 0; height: 26px; padding: 0 8px;
      font: inherit; color: var(--fg);
      background: var(--field); border: 1px solid transparent; border-radius: 5px; outline: none;
    }
    input:focus { border-color: var(--fg); background: var(--bg); }
    input::placeholder { color: var(--muted); }
    input::-webkit-inner-spin-button { display: none; }

    .foot { color: var(--muted); font-size: 12px; min-height: 36px; }
    .foot code { font: 12px ui-monospace, Consolas, monospace; color: var(--fg); }

    button {
      margin-left: auto; height: 24px; padding: 0 10px; flex: none;
      font: inherit; font-size: 12px; color: var(--bg); background: var(--fg);
      border: none; border-radius: 5px; cursor: pointer;
    }
    button:disabled { background: var(--line); color: var(--muted); cursor: default; }
    button.link { background: none; color: var(--fg); padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <div class="row head">
    <span class="brand">BrowserX</span>
    <span class="state"><span class="dot"></span><span id="state">…</span></span>
  </div>

  <form id="form">
    <div class="row">
      <label for="name">名字</label>
      <input id="name" placeholder="chrome" autocomplete="off" spellcheck="false" title="连了多个浏览器时，用 --browser 名字 区分" />
    </div>
    <div class="row">
      <label for="port">端口</label>
      <input id="port" type="number" min="1" max="65535" placeholder="9777" />
    </div>
    <div class="row foot">
      <span id="info"></span>
      <span id="off" hidden>运行 <code>bx daemon start</code> 后 <button type="button" class="link" id="retry">重试</button></span>
      <button type="submit" id="save" disabled>保存</button>
    </div>
  </form>

  <script src="options.js"></script>
</body>
</html>
